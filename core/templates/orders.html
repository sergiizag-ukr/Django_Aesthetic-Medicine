{% extends 'base.html' %}

{% block title %}
Замовлення
{% endblock %}

{% block content %}

<h1>Замовлення</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Клієнт ID</th>
        <th>Послуга</th>
        <th>Статус</th>
        <th>Ціна</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order.id }}</td>
        <td>{{ order.client_id }}</td>
        <td>{{ order.service }}</td>
        <td>{{ order.status }}</td>
        <td>{{ order.price }} ₴</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
