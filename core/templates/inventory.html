{% extends 'base.html' %}

{% block title %}
Інвентар
{% endblock %}

{% block content %}

<h1>Інвентар</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Матеріал</th>
        <th>Кількість</th>
        <th>Ціна</th>
    </tr>

    {% for item in inventory %}
    <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.price }} ₴</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
