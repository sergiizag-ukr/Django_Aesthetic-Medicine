{% extends 'base.html' %}

{% block title %}
Видалення клієнта
{% endblock %}

{% block content %}

<h1>Видалення клієнта</h1>

<p>
    Ви впевнені, що хочете видалити:
</p>

<h2>
    {{ client.first_name }} {{ client.last_name }}
</h2>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Так, видалити
    </button>

    <a href="/clients/{{ client.id }}/">
        Скасувати
    </a>

</form>

{% endblock %}
