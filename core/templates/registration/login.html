{% extends 'base.html' %}

{% block title %}
Вхід
{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h1>Вхід до системи</h1>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_username">
                    Ім'я користувача
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    class="form-input"
                    placeholder="Введіть ім'я користувача"
                    required
                >

            </div>

            <div class="form-group">

                <label for="id_password">
                    Пароль
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="form-input"
                    placeholder="Введіть пароль"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn auth-btn">
                Увійти
            </button>

        </form>

        <div class="auth-footer">
            Немає акаунта?
            <a href="{% url 'register' %}">
                Зареєструватися
            </a>
        </div>

    </div>

</div>

{% endblock %}
